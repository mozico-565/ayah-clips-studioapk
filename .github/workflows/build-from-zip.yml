
name: Build Ayah Clips APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ayah-Clips-Android-Source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Ayah-Clips-Android-Source.zip
          mkdir -p "$RUNNER_TEMP/ayah-source"

          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          dest = Path(os.environ["RUNNER_TEMP"]) / "ayah-source"

          with ZipFile("Ayah-Clips-Android-Source.zip") as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path")
              z.extractall(dest)
          PY

          PACKAGE=$(find "$RUNNER_TEMP/ayah-source" \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          test -n "$PACKAGE"
          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          java -version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bun install --no-save

      - name: Restore Lovable original styling
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path("src/styles.css")
          config = Path("vite.mobile.config.ts")

          if not css.exists() or not config.exists():
              raise SystemExit("Missing CSS or Vite config")

          s = css.read_text()

          s = re.sub(
              r'@import\s+"tailwindcss"(?:\s+source\(none\))?;',
              '',
              s
          )

          s = s.replace('@import "tw-animate-css";', '')
          s = re.sub(r'@source\s+"[^"]+";', '', s)

          css.write_text(
              '@import "tailwindcss";\n'
              '@import "tw-animate-css";\n'
              + s.lstrip()
          )

          v = config.read_text()

          if '@tailwindcss/vite' not in v:
              v = 'import tailwindcss from "@tailwindcss/vite";\n' + v

          v, count = re.subn(
              r'plugins\s*:\s*\[\s*react\(\)\s*\]',
              'plugins: [react(), tailwindcss()]',
              v,
              count=1
          )

          if count != 1:
              raise SystemExit("Cannot locate Vite plugins")

          config.write_text(v)

          print("Lovable styling restored")
          PY

      - name: Build mobile frontend
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          bun run build:mobile

          if [ -f dist-mobile/mobile.html ]; then
            mv dist-mobile/mobile.html dist-mobile/index.html
          fi

          test -s dist-mobile/index.html

          echo "Checking generated assets..."
          find dist-mobile -maxdepth 2 -type f | head -30

      - name: Initialize Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            bunx cap add android
          fi

          bunx cap sync android

      - name: Build Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayah-Clips-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
