
name: Build Ayah Clips from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ayah-Clips-Android-Source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f Ayah-Clips-Android-Source.zip

          mkdir -p "$RUNNER_TEMP/ayah-source"

          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          dest = Path(os.environ["RUNNER_TEMP"]) / "ayah-source"

          with ZipFile("Ayah-Clips-Android-Source.zip") as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path")
              z.extractall(dest)
          PY

          if [ -f "$RUNNER_TEMP/ayah-source/package.json" ]; then
            PROJECT_DIR="$RUNNER_TEMP/ayah-source"
          else
            PACKAGE=$(find "$RUNNER_TEMP/ayah-source" -name package.json -not -path '*/node_modules/*' -print -quit)
            test -n "$PACKAGE"
            PROJECT_DIR=$(dirname "$PACKAGE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build mobile frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build:mobile

      - name: Initialize Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayah-Clips-debug-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
