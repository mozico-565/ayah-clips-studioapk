
name: Build Ayah Clips APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ayah-Clips-Android-Source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Ayah-Clips-Android-Source.zip
          mkdir -p "$RUNNER_TEMP/ayah-source"

          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          dest = Path(os.environ["RUNNER_TEMP"]) / "ayah-source"

          with ZipFile("Ayah-Clips-Android-Source.zip") as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path")
              z.extractall(dest)
          PY

          PACKAGE=$(find "$RUNNER_TEMP/ayah-source" \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          test -n "$PACKAGE"
          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

            - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bun install --no-save

      - name: Fix Tailwind CSS compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path("src/styles.css")
          if not css.exists():
              raise SystemExit("Missing src/styles.css")

          s = css.read_text()
          s = s.replace(
              '@import "tailwindcss" source(none);',
              '@import "tailwindcss";'
          )
          s = s.replace('@source "../src";', '')
          s = s.replace('@import "tw-animate-css";', '')
          s = '@import "tw-animate-css";\n' + s
          css.write_text(s)

          config = Path("vite.mobile.config.ts")
          if not config.exists():
              raise SystemExit("Missing Vite mobile config")

          s = config.read_text()
          if "css:" not in s:
              s = s.replace(
                  "plugins:[react()],",
                  'plugins:[react()],css:{transformer:"postcss",minify:false},'
              )
          config.write_text(s)
          PY

      - name: Build mobile frontend
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bun run build:mobile

          if [ -f dist-mobile/mobile.html ]; then
            mv dist-mobile/mobile.html dist-mobile/index.html
          fi

          test -f dist-mobile/index.html

          echo "Mobile frontend built successfully"

      - name: Initialize Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            bunx cap add android
          fi

          bunx cap sync android

      - name: Build Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayah-Clips-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
